<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="配色ルールを選んで5色のカラーパレットを生成・保存できるツール">
<title>色見本ジェネレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }

/* Layout: 上部ツールバー → 大きな色見本ストリップ → 保存したパレットの棚 */
:root {
  --bg: #f6f6f3;
  --surface: #ffffff;
  --fg: #1b1c1f;
  --muted: #6b6d74;
  --line: #dcdcd6;
  --accent: #2f4de0;
  --accent-fg: #ffffff;
  --danger: #c4322b;
  --font-display: "Bricolage Grotesque", "Zen Kaku Gothic New", system-ui, sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131417; --surface: #1d1f24; --fg: #ececea; --muted: #9a9ca3;
    --line: #30333a; --accent: #7d92ff; --accent-fg: #0e1020; --danger: #ff7a6e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131417; --surface: #1d1f24; --fg: #ececea; --muted: #9a9ca3;
  --line: #30333a; --accent: #7d92ff; --accent-fg: #0e1020; --danger: #ff7a6e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 48px; display: grid; gap: 20px; }

header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; margin: 0; line-height: 1.1; }
h1 small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 13px; color: var(--muted); letter-spacing: 0; margin-top: 4px; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rules { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.rules button { border: 0; background: transparent; color: var(--muted); font: 500 13px var(--font-body); padding: 6px 10px; border-radius: 7px; cursor: pointer; }
.rules button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.rules button:hover:not([aria-pressed="true"]) { color: var(--fg); }

.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 700 14px var(--font-body); padding: 9px 14px; border-radius: 10px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn:hover { filter: brightness(1.06); }
kbd { font: 500 11px var(--font-mono); padding: 1px 5px; border-radius: 4px; border: 1px solid currentColor; opacity: .7; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.strip { display: flex; height: clamp(360px, 62vh, 640px); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
.swatch { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 8px; padding: 20px 8px; transition: background-color .35s ease; }
.swatch .hex { font: 700 clamp(15px, 1.6vw, 20px) var(--font-mono); letter-spacing: .02em; background: none; border: 0; color: inherit; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
.swatch .hex:hover { background: color-mix(in srgb, currentColor 14%, transparent); }
.swatch .meta { font: 500 11px var(--font-mono); opacity: .72; text-align: center; }
.swatch .tools { display: flex; gap: 6px; }
.swatch .tools button { background: color-mix(in srgb, currentColor 12%, transparent); color: inherit; border: 0; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
.swatch .tools button[aria-pressed="true"] { background: currentColor; }
.swatch .tools button[aria-pressed="true"] svg { color: var(--sw-bg); }
.swatch svg { width: 18px; height: 18px; }
.swatch .contrast { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font: 500 11px var(--font-mono); opacity: .7; white-space: nowrap; }

.bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.hint { color: var(--muted); font-size: 13px; }

section.saved h2 { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin: 8px 0 12px; display: flex; gap: 10px; align-items: baseline; }
section.saved h2 span { font: 500 12px var(--font-mono); color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; }
.card .mini { display: flex; height: 64px; border: 0; padding: 0; cursor: pointer; width: 100%; }
.card .mini i { flex: 1; }
.card .info { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; }
.card .info div { min-width: 0; }
.card .name { font: 700 13px var(--font-body); color: var(--fg); background: none; border: 0; padding: 2px 4px; margin-left: -4px; border-radius: 5px; cursor: text; text-align: left; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.card .name:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
.card .name svg { width: 12px; height: 12px; flex: none; opacity: 0; color: var(--muted); }
.card .name:hover svg, .card .name:focus-visible svg { opacity: 1; }
.card .name-input { font: 700 13px var(--font-body); color: var(--fg); background: var(--bg); border: 1px solid var(--accent); border-radius: 5px; padding: 2px 4px; margin-left: -4px; width: 100%; outline: none; }
.card .sub { font: 500 11px var(--font-mono); color: var(--muted); }
.card .del { border: 0; background: none; color: var(--muted); cursor: pointer; font: 500 12px var(--font-body); padding: 4px 6px; border-radius: 6px; white-space: nowrap; }
.card .del.armed { color: var(--danger); font-weight: 700; }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 24px; color: var(--muted); text-align: center; font-size: 14px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 500; font-size: 14px; opacity: 0; pointer-events: none; transition: .2s ease; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 720px) {
  .strip { flex-direction: column; height: auto; }
  .swatch { flex-direction: row; justify-content: space-between; min-height: 84px; padding: 12px 16px; }
  .swatch .contrast { position: static; transform: none; order: 3; }
  .swatch .meta { display: none; }
}
@media (prefers-reduced-motion: reduce) { .swatch, .toast { transition: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>色見本ジェネレーター<small>配色ルールを選んで生成。気に入った色はロックして残せます。</small></h1>
    <div class="controls">
      <div class="rules" role="group" aria-label="配色ルール" id="rules"></div>
    </div>
  </header>

  <div class="strip" id="strip" aria-live="polite"></div>

  <div class="bar">
    <div class="controls">
      <button class="btn primary" id="gen" type="button">生成 <kbd>Space</kbd></button>
      <button class="btn" id="save" type="button">保存 <kbd>S</kbd></button>
      <button class="btn" id="css" type="button">CSS変数をコピー</button>
    </div>
    <span class="hint">HEXをクリックでコピー ・ 鍵アイコンで色を固定</span>
  </div>

  <section class="saved">
    <h2>保存したパレット <span id="count">0</span></h2>
    <div id="saved"></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const RULES = [
  { id: 'analogous', label: '類似色' },
  { id: 'complementary', label: '補色' },
  { id: 'triad', label: 'トライアド' },
  { id: 'split', label: '分裂補色' },
  { id: 'mono', label: 'モノクロ' },
  { id: 'random', label: 'ランダム' },
];
const N = 5;
const KEY = 'palette-gen.saved.v1';
const RULE_KEY = 'palette-gen.rule.v1';

const ICON_LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const ICON_UNLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>';

const ICON_PEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function startRename(btn) {
  const i = +btn.dataset.rename, p = saved[i];
  const input = document.createElement('input');
  input.type = 'text'; input.className = 'name-input'; input.id = `rename-${p.at}-${i}`;
  input.value = p.name; input.maxLength = 40; input.setAttribute('aria-label', 'パレットの名前');
  btn.replaceWith(input); input.focus(); input.select();
  let done = false;
  const finish = commit => {
    if (done) return; done = true;
    const v = input.value.trim();
    if (commit && v && v !== p.name) { p.name = v; store.set(KEY, saved); toast('名前を変更しました'); }
    renderSaved();
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};

let rule = store.get(RULE_KEY, 'analogous');
if (!RULES.some(r => r.id === rule)) rule = 'analogous';
let colors = [];          // [{h,s,l,hex}]
const locked = new Set();
let saved = store.get(KEY, null);
if (!Array.isArray(saved)) saved = [
  { name: '見本：海辺の朝', colors: ['#0B3954', '#087E8B', '#BFD7EA', '#FF5A5F', '#C81D25'], rule: 'complementary', at: Date.now() },
  { name: '見本：抹茶', colors: ['#2D3A2E', '#4F6D44', '#88A66B', '#C9D8A8', '#F1F3E6'], rule: 'mono', at: Date.now() },
];

/* ---- 色変換 ---- */
const rand = (a, b) => Math.random() * (b - a) + a;
const wrap = h => ((h % 360) + 360) % 360;
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return '#' + [f(0), f(8), f(4)].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join('').toUpperCase();
}
function hexToRgb(hex) { return [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)); }
function hexToHsl(hex) {
  let [r, g, b] = hexToRgb(hex).map(v => v / 255);
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0, l = (max + min) / 2, s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  if (d) h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return { h: wrap(h * 60), s: s * 100, l: l * 100 };
}
function luminance(hex) {
  return hexToRgb(hex).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; })
    .reduce((acc, v, i) => acc + v * [.2126, .7152, .0722][i], 0);
}
function contrast(a, b) { const [x, y] = [luminance(a), luminance(b)].sort((p, q) => q - p); return (x + .05) / (y + .05); }
const ink = hex => contrast(hex, '#111111') >= contrast(hex, '#FFFFFF') ? '#111111' : '#FFFFFF';

/* ---- 配色ルール ---- */
function build(ruleId, base) {
  const ls = [28, 42, 56, 70, 84].sort(() => Math.random() - .5);
  const sat = () => rand(48, 82);
  const mk = (h, s, l) => ({ h: wrap(h), s, l, hex: hslToHex(wrap(h), s, l) });
  switch (ruleId) {
    case 'analogous': return [-40, -20, 0, 20, 40].map((o, i) => mk(base + o, sat(), ls[i]));
    case 'complementary': return [0, 0, 180, 180, 0].map((o, i) => mk(base + o + rand(-8, 8), sat(), ls[i]));
    case 'triad': return [0, 120, 240, 0, 120].map((o, i) => mk(base + o, sat(), ls[i]));
    case 'split': return [0, 150, 210, 0, 180].map((o, i) => mk(base + o, sat(), ls[i]));
    case 'mono': { const s = rand(40, 70); return [20, 36, 52, 68, 86].map(l => mk(base, s, l)); }
    default: return Array.from({ length: N }, () => mk(rand(0, 360), rand(30, 90), rand(25, 85)));
  }
}
function generate() {
  const anchor = [...locked].sort()[0];
  const base = anchor !== undefined ? colors[anchor].h : rand(0, 360);
  let fresh = build(rule, base);
  if (anchor !== undefined && rule !== 'random') {
    // ロックした色がルールの基準色(位置0相当)に来るよう、基準色相のスロットを探して入れ替え
    const slot = fresh.findIndex(c => Math.abs(c.h - wrap(base)) < 10);
    if (slot > -1 && slot !== anchor) [fresh[slot], fresh[anchor]] = [fresh[anchor], fresh[slot]];
  }
  colors = colors.length ? fresh.map((c, i) => locked.has(i) ? colors[i] : c) : fresh;
  render();
}

/* ---- 描画 ---- */
const $ = id => document.getElementById(id);
function renderRules() {
  $('rules').innerHTML = RULES.map(r => `<button type="button" data-rule="${r.id}" aria-pressed="${r.id === rule}">${r.label}</button>`).join('');
}
function render() {
  $('strip').innerHTML = colors.map((c, i) => {
    const fg = ink(c.hex), ratio = contrast(c.hex, fg).toFixed(1);
    const isL = locked.has(i);
    return `<div class="swatch" style="background:${c.hex};color:${fg};--sw-bg:${c.hex}">
      <span class="contrast" title="文字とのコントラスト比">${ratio}:1 ${ratio >= 7 ? 'AAA' : ratio >= 4.5 ? 'AA' : ''}</span>
      <div class="tools"><button type="button" data-lock="${i}" aria-pressed="${isL}" aria-label="${isL ? '固定を解除' : 'この色を固定'}">${isL ? ICON_LOCK : ICON_UNLOCK}</button></div>
      <button type="button" class="hex" data-copy="${c.hex}" aria-label="${c.hex} をコピー">${c.hex}</button>
      <span class="meta">H${Math.round(c.h)} S${Math.round(c.s)} L${Math.round(c.l)}</span>
    </div>`;
  }).join('');
}
function renderSaved() {
  $('count').textContent = saved.length;
  if (!saved.length) { $('saved').innerHTML = '<div class="empty">まだ保存したパレットはありません。気に入った配色ができたら「保存」を押してください。</div>'; return; }
  $('saved').innerHTML = '<div class="grid">' + saved.map((p, i) => `
    <div class="card">
      <button type="button" class="mini" data-load="${i}" aria-label="${esc(p.name)} を読み込む">${p.colors.map(h => `<i style="background:${h}"></i>`).join('')}</button>
      <div class="info"><div><button type="button" class="name" data-rename="${i}" title="クリックで名前を変更"><span>${esc(p.name)}</span>${ICON_PEN}</button><div class="sub">${RULES.find(r => r.id === p.rule)?.label ?? ''} · ${p.colors.join(' ')}</div></div>
      <button type="button" class="del" data-del="${i}">削除</button></div>
    </div>`).join('') + '</div>';
}

let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600); }
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); toast(`${label}をコピーしました`); }
  catch { toast('コピーできませんでした。テキストを選択してコピーしてください'); }
}

function save() {
  const d = new Date();
  const name = `パレット ${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  saved.unshift({ name, colors: colors.map(c => c.hex), rule, at: Date.now() });
  const ok = store.set(KEY, saved);
  renderSaved();
  toast(ok ? '保存しました' : '保存しました（このブラウザでは再読み込みで消えます）');
}

/* ---- イベント ---- */
$('rules').addEventListener('click', e => {
  const b = e.target.closest('[data-rule]'); if (!b) return;
  rule = b.dataset.rule; store.set(RULE_KEY, rule); renderRules(); generate();
});
$('strip').addEventListener('click', e => {
  const lk = e.target.closest('[data-lock]');
  if (lk) { const i = +lk.dataset.lock; locked.has(i) ? locked.delete(i) : locked.add(i); render(); document.querySelector(`[data-lock="${i}"]`)?.focus(); return; }
  const cp = e.target.closest('[data-copy]');
  if (cp) copy(cp.dataset.copy, cp.dataset.copy);
});
$('saved').addEventListener('click', e => {
  const rn = e.target.closest('[data-rename]');
  if (rn) { startRename(rn); return; }
  const ld = e.target.closest('[data-load]');
  if (ld) {
    const p = saved[+ld.dataset.load];
    colors = p.colors.map(hex => ({ ...hexToHsl(hex), hex }));
    locked.clear(); if (p.rule) { rule = p.rule; renderRules(); }
    render(); toast(`「${p.name}」を読み込みました`); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
  }
  const del = e.target.closest('[data-del]');
  if (del) {
    if (!del.classList.contains('armed')) {
      del.classList.add('armed'); del.textContent = 'もう一度押して削除';
      setTimeout(() => { if (del.isConnected) { del.classList.remove('armed'); del.textContent = '削除'; } }, 2500);
      return;
    }
    saved.splice(+del.dataset.del, 1); store.set(KEY, saved); renderSaved(); toast('削除しました');
  }
});
$('gen').onclick = generate;
$('save').onclick = save;
$('css').onclick = () => copy(':root {\n' + colors.map((c, i) => `  --color-${i + 1}: ${c.hex};`).join('\n') + '\n}', 'CSS変数');
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select, button, a') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); generate(); }
  else if (e.key === 's' || e.key === 'S') { e.preventDefault(); save(); }
});

renderRules(); generate(); renderSaved();
</script>

</body>
</html>
